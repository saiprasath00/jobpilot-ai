services:
  - type: web
    name: jobpilot-ai
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: mwapi
      - key: MWAPI_MODEL
        value: claude-sonnet-4-6
      - key: MWAPI_API_KEY
        sync: false
      - key: APP_PASSWORD
        generateValue: true
